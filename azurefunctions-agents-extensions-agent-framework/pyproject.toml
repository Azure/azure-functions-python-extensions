[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azurefunctions-agents-extensions-agent-framework"
dynamic = ["version"]
requires-python = ">=3.13"
authors = [
    { name = "Azure Functions team at Microsoft Corp.", email = "azurefunctions@microsoft.com" },
]
description = "Microsoft Agent Framework integration for Azure Functions."
readme = "README.md"
license = { text = "MIT License" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: Web Environment",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "agent-framework-core>=1.13.0,<2",
    "azurefunctions-agents-extensions-base>=1.0.0b1",
]

[project.optional-dependencies]
workflows = [
    "agent-framework-declarative>=1.0.3,<2",
]
mcp = [
    "azure-identity>=1.25.3,<2",
    "httpx>=0.27,<1",
    "mcp>=1.28.1,<2",
]
durable = [
    "azurefunctions-agents-extensions-base[durable]>=1.0.0b1",
    # Prototype only. PR #72 supplies DAFX's SDK 2 support. Pin both packages
    # to the same revision until compatible distributions are published.
    "agent-framework-azurefunctions @ git+https://github.com/microsoft/agent-framework-durable-extension.git@aa9529ec489e16ac64b73bd68d5adbb8e4945258#subdirectory=python/packages/azurefunctions",
    "agent-framework-durabletask @ git+https://github.com/microsoft/agent-framework-durable-extension.git@aa9529ec489e16ac64b73bd68d5adbb8e4945258#subdirectory=python/packages/durabletask",
]
dev = [
    "azure-functions-durable>=2.0.0b2",
    "coverage",
    "flake8",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-instafail",
]

[project.entry-points."azurefunctions.agents.extensions.providers"]
agent_framework = "azurefunctions.agents.extensions.agent_framework.provider:create_provider"

[tool.setuptools.dynamic]
version = { attr = "azurefunctions.agents.extensions.agent_framework.__version__" }

[tool.setuptools.packages.find]
include = ["azurefunctions.agents.extensions.agent_framework*"]

[tool.setuptools.package-data]
"azurefunctions.agents.extensions.agent_framework" = ["py.typed"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["azure", "azure.*"]
ignore_missing_imports = true
