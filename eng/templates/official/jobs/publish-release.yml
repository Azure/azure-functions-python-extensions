jobs:

- job: "CreateReleaseBranch"
  displayName: 'Create Release Branch'
  pool:
    name: 1es-pool-azfunc
    image: 1es-ubuntu-22.04
    os: linux
  steps:
  - pwsh: |
      $githubToken = "$(GithubPat)"
      $newLibraryVersion = "$(NewLibraryVersion)"
      $extensionName= "$(ExtensionName)"
      $extensionDirectory = "$(ExtensionDirectory)"
      
      if($newLibraryVersion -match '(\d)+.(\d)+.*') {
          # Create GitHub credential
          git config --global user.name "AzureFunctionsPython"
          git config --global user.email "azfunc@microsoft.com"
      
          # Heading to Artifact Repository
          Write-Host "Operating based on $stagingDirectory/azure-functions-python-extensions"
          git checkout -b "$extensionName/release/$newLibraryVersion"
      
          # Change __init__.py version
          Write-Host "Change version number in $extensionDirectory __init__.py to $newLibraryVersion"
          ((Get-Content $extensionName/$extensionDirectory/__init__.py) -replace "__version__ = '(\d)+.(\d)+.*'", "__version__ = '$newLibraryVersion'" -join "`n") + "`n" | Set-Content -NoNewline $extensionName/$extensionDirectory/__init__.py
          git add $extensionName/$extensionDirectory/__init__.py
          git commit -m "build: update $extensionName Version to $newLibraryVersion"
      
          # Create release branch release/X.Y.Z
          Write-Host "Creating release branch release/$newLibraryVersion"
          git push --repo="https://$githubToken@github.com/Azure/azure-functions-python-extensions.git"
          
      } else {
          Write-Host "NewLibraryVersion $newLibraryVersion is malformed (example: 1.5.0)"
          exit -1
      }
    displayName: 'Push release/x.y.z'

- job: "CheckReleaseBranch"
  dependsOn: ['CreateReleaseBranch']
  displayName: '(Manual) Check Release Branch'
  pool: server
  steps:
  - task: ManualValidation@1
    displayName: '(Optional) Modify release/x.y.z branch'
    inputs:
      notifyUsers: ''  # No email notifications sent
      instructions: |
        1. Check if the https://github.com/Azure/azure-functions-python-extensions/tree/release/$(NewLibraryVersion) passes all unit test.
        2. If not, modify the release/$(NewLibraryVersion) branch.
        3. Ensure release/$(NewLibraryVersion) branch contains all necessary changes.

- job: "CreateReleaseTag"
  dependsOn: ['CheckReleaseBranch']
  displayName: 'Create Release Tag'
  steps:
  - pwsh: |
      $githubToken = "$(GithubPat)"
      $newLibraryVersion = "$(NewLibraryVersion)"
      $githubToken = "$(GithubPat)"
      $extensionName= "$(ExtensionName)"
      $extensionDirectory = "$(ExtensionDirectory)"
      
      if($newLibraryVersion -match '(\d)+.(\d)+.(\d)+') {
          # Create GitHub credential
          git config --global user.name "AzureFunctionsPython"
          git config --global user.email "azfunc@microsoft.com"
      
          # Clone Repository
          git clone https://$githubToken@github.com/Azure/azure-functions-python-extensions
          Write-Host "Cloned azure-functions-python-extensions into local"
          Set-Location "azure-functions-python-extensions"
          git checkout "origin/$extensionName/release/$newLibraryVersion"
      
          # Create release tag X.Y.Z
          Write-Host "Creating release tag $newLibraryVersion"
          git tag -a "$extensionName/$newLibraryVersion" -m "$newLibraryVersion"
      
          # Push tag to remote
          git push origin $extensionName/$newLibraryVersion

      } else {
          Write-Host "NewLibraryVersion $newLibraryVersion is malformed (example: 1.5.0)"
          exit -1
      }
    displayName: 'Tag and push x.y.z'
  - pwsh: |
      $githubUser = "$(GithubUser)"
      $githubToken = "$(GithubPat)"
      $newLibraryVersion = "$(NewLibraryVersion)"
      $extensionName= "$(ExtensionName)"
      $extensionDirectory = "$(ExtensionDirectory)"
      
      if($newLibraryVersion -match '(\d)+.(\d)+.(\d)+') {
          # Create GitHub credential
          $credential = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${githubUser}:${githubToken}"))
      
          # Create Release Note
          Write-Host "Creating release note in GitHub"
          $body = (@{tag_name="$newLibraryVersion";name="$extensionName $newLibraryVersion";body="- Fill in Release Note Here";draft=$true} | ConvertTo-Json -Compress)
          $response = Invoke-WebRequest -Headers @{"Cache-Control"="no-cache";"Content-Type"="application/json";"Authorization"="Basic $credential"} -Method Post -Body "$body" -Uri "https://api.github.com/repos/Azure/azure-functions-python-extensions/releases"
      
          # Return Value
          if ($response.StatusCode -ne 201) {
              Write-Host "Failed to create release note in GitHub"
              exit -1
          }
      
          $draftUrl = $response | ConvertFrom-Json | Select -expand url
          Write-Host "Release draft created in $draftUrl"
      } else {
          Write-Host "NewLibraryVersion $newLibraryVersion is malformed (example: 1.1.8)"
          exit -1
      }
    displayName: 'Create GitHub release draft'

- job: "CheckGitHubRelease"
  dependsOn: ['CreateReleaseTag']
  displayName: '(Manual) Check GitHub release note'
  pool: server
  steps:
  - task: ManualValidation@1
    displayName: 'Write GitHub release note'
    inputs:
      notifyUsers: ''
      instructions: 'Please head to https://github.com/Azure/azure-functions-python-extensions/releases to finish the release note'

- job: "CreateWorkerPR"
  dependsOn: ['CheckGitHubRelease']
  displayName: 'Create PR in Worker Repo'
  steps:
  - pwsh: |
      $githubUser = "$(GithubUser)"
      $githubToken = "$(GithubPat)"
      $newLibraryVersion = "$(NewLibraryVersion)"
      $extensionName= "$(ExtensionName)"
      $extensionDirectory = "$(ExtensionDirectory)"
      $newBranch = "extensions/$(ExtensionName)/$newLibraryVersion"
      
      if($newLibraryVersion -match '(\d)+.(\d)+.*') {
          # Create GitHub credential
          git config --global user.name "AzureFunctionsPython"
          git config --global user.email "azfunc@microsoft.com"
      
          # Create GitHub credential
          $credential = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${githubUser}:${githubToken}"))
      
          # Clone Repository
          git clone https://$githubToken@github.com/Azure/azure-functions-python-worker
          Write-Host "Cloned azure-functions-python-worker into local and checkout $newBranch branch"
          Set-Location "azure-functions-python-worker"
          git checkout -b $newBranch "origin/dev"
      
          # Modify Extension $extensionName Version in pyproject.toml
          Write-Host "Replacing Extension $extensionName version in worker's pyproject.toml"
          ((Get-Content workers/pyproject.toml) -replace '"$(ExtensionName)==(\d)+.(\d)+.*"','"$(ExtensionName)==$(NewLibraryVersion)"' -join "`n") + "`n" | Set-Content -NoNewline workers/pyproject.toml

          # Commit Python Version
          Write-Host "Pushing $newBranch to azure-functions-python-worker repo"
          git add workers/pyproject.toml
          git commit -m "build: update $extensionName version to $newLibraryVersion"
          git push origin $newBranch
      
          # Create PR
          Write-Host "Creating PR draft in GitHub"
          $body = (@{head="$newBranch";base="dev";body="Python Extension [$extensionName] Version [$newLibraryVersion](https://github.com/Azure/azure-functions-python-extensions/releases/tag/$extensionName/$newLibraryVersion)";draft=$true;maintainer_can_modify=$true;title="build: update $extensionName version to $newLibraryVersion"} | ConvertTo-Json -Compress)
          $response = Invoke-WebRequest -Headers @{"Cache-Control"="no-cache";"Content-Type"="application/json";"Authorization"="Basic $credential";"Accept"="application/vnd.github.v3+json"} -Method Post -Body "$body" -Uri "https://api.github.com/repos/Azure/azure-functions-python-worker/pulls"
      
          # Return Value
          if ($response.StatusCode -ne 201) {
              Write-Host "Failed to create PR in Azure Functions Python Worker"
              exit -1
          }
      
          $draftUrl = $response | ConvertFrom-Json | Select -expand url
          Write-Host "PR draft created in $draftUrl"
      } else {
          Write-Host "NewLibraryVersion $newLibraryVersion is malformed (example: 1.1.8)"
          exit -1
      }
    displayName: 'Create PR in Worker Repo'

- job: "FinishWorkerPr"
  dependsOn: ['CreateWorkerPR']
  displayName: '(Manual) Finish Worker PR'
  pool: server
  steps:
  - task: ManualValidation@1
    displayName: 'Wait For Python Worker Build'
    inputs:
      notifyUsers: ''
      instructions: |
        1. Please wait and check if all goes green in the https://github.com/Azure/azure-functions-python-worker/pulls
        2. Merge the PR into worker dev branch
    condition: always()

- job: "PyPIPackage"
  dependsOn: ['FinishWorkerPr']
  displayName: 'PyPI Package'
  steps:
  - task: PipAuthenticate@1
    displayName: 'Pip Authenticate'
    inputs:
      artifactFeeds: internal/PythonExtensions_Internal_PublicPackages
  - task: DownloadPipelineArtifact@2
    displayName: 'Download Python Extension release/.x.y.z Artifact'
    inputs:
      buildType: specific
      project: '3f99e810-c336-441f-8892-84983093ad7f'
      definition: 798
      specificBuildWithTriggering: true
      buildVersionToDownload: latestFromBranch
      branchName: refs/heads/dev
      targetPath: PythonExtensionArtifact
  - task: UsePythonVersion@0
    displayName: 'Use Python 3.11'
    inputs:
      versionSpec: 3.11
  - pwsh: |
      $newLibraryVersion = "$(NewLibraryVersion)"
      $pypiToken = "$(PypiToken)"
      $extensionName= "$(ExtensionName)"
      $extensionDirectory = "$(ExtensionDirectory)"
      
      # Setup local Python environment
      Write-Host "Setup local Python environment"
      python -m pip install -U pip
      pip install twine
  
      # Build wheels and project
      Write-Host "Build Wheels and Upload to https://upload.pypi.org/project/$extensionName/$newLibraryVersion/"
      twine upload --repository-url https://upload.pypi.org/legacy/ --username "__token__" --password "$pypiToken" PythonExtensionArtifact/$extensionName/$extensionName/dist/*
      Start-Sleep -Seconds 3
  
      # Checking if the new version is uploaded
      Write-Host "Check if new version is uploaded"
      $response = Invoke-WebRequest -Headers @{"Cache-Control"="no-cache"} -Method Get -Uri "https://pypi.org/project/$extensionName/$newLibraryVersion/"
  
      # Return Value
      if ($response.StatusCode -ne 200) {
          Write-Host "Failed to verify https://pypi.org/project/$extensionName/$newLibraryVersion/"
          exit -1
      }
    displayName: 'Publish package to pypi.org'
