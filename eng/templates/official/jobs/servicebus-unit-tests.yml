jobs:
  - job: "TestPython"
    displayName: "Run ServiceBus Tests"

    strategy:
      matrix:
        python39:
          PYTHON_VERSION: '3.9'
        python310:
          PYTHON_VERSION: '3.10'
        python311:
          PYTHON_VERSION: '3.11'
        python312:
          PYTHON_VERSION: '3.12'

    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - bash: |
          python -m pip install --upgrade pip
          cd azurefunctions-extensions-bindings-servicebus
          python -m pip install -U -e .[dev]
        displayName: 'Install dependencies'
      - bash: |
          python -m pytest -q --instafail azurefunctions-extensions-bindings-servicebus/tests/
        env:
          AzureWebJobsStorage: $(AzureWebJobsStorage)
        displayName: "Running ServiceBus $(PYTHON_VERSION) Python Extension Tests"
