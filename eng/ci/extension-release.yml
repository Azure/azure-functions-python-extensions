pr: none

parameters:
  - name: ExtensionName
    displayName: 'Extension project to release'
    type: string
    default: 'azurefunctions-extensions-base'
  - name: ExtensionDirectory
    displayName: 'Package path under the extension project directory'
    type: string
  - name: NewLibraryVersion
    displayName: 'Extension version to release (for example, 1.2.0)'
    type: string
    default: ''

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

variables:
  - group: azure-functions-python-release
  - name: codeql.excludePathPatterns
    value: deps/,build/

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    stages:
      - stage: BumpVersion
        displayName: 'Bump Extension Version'
        dependsOn: []
        jobs:
          - template: /eng/templates/official/release/bump-version.yml@self
            parameters:
              extensionVersion: ${{ parameters.NewLibraryVersion }}
              extensionName: ${{ parameters.ExtensionName }}
              extensionDirectory: ${{ parameters.ExtensionDirectory }}
              createPullRequest: true
              baseBranch: dev

      - stage: Build
        displayName: 'Build Extension Artifacts'
        dependsOn: BumpVersion
        jobs:
          - template: /eng/templates/official/release/build-artifacts.yml@self
            parameters:
              extensionVersion: ${{ parameters.NewLibraryVersion }}
              extensionName: ${{ parameters.ExtensionName }}
              artifactName: ${{ parameters.ExtensionName }}

      - stage: Release
        displayName: 'Release Extension'
        dependsOn: Build
        jobs:
          - template: /eng/templates/official/release/publish-release.yml@self
            parameters:
              extensionVersion: ${{ parameters.NewLibraryVersion }}
              extensionName: ${{ parameters.ExtensionName }}
              artifactName: ${{ parameters.ExtensionName }}
