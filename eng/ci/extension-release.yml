pr: none

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release
  pipelines:
    - pipeline: officialBuild
      project: internal
      source: python-extensions.official
      branch: dev
      trigger: none

variables:
  - group: azure-functions-python-release
  - name: codeql.excludePathPatterns
    value: deps/,build/

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    stages:
      - stage: Release
        jobs:
          - template: /eng/templates/official/jobs/publish-release.yml@self
