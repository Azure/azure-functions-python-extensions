[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azurefunctions-agents-durable"
dynamic = ["version"]
requires-python = ">=3.10"
authors = [{ name = "Azure Functions team at Microsoft Corp.", email = "azurefunctions@microsoft.com"}]
description = "Durable Functions extension for Azure Functions Agents Framework."
readme = "README.md"
license = {text = "MIT License"}
classifiers= [
        'License :: OSI Approved :: MIT License',
        'Intended Audience :: Developers',
        'Programming Language :: Python :: 3',        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Operating System :: MacOS :: MacOS X',
        'Environment :: Web Environment',
        'Development Status :: 5 - Production/Stable',
    ]
dependencies = [
    'azure-functions>=1.19.0',
    'azure-functions-durable>=1.2.9',
    'aiohttp>=3.8.0',
    ]

[project.optional-dependencies]
mcp = [
    'mcp>=1.0.0',
]
test = [
    'pytest>=7.0.0',
    'pytest-asyncio>=0.21.0',
]
dev = [
    'flake8',
    'mypy',
    'pytest',
    'pytest-cov',
    'coverage',
    'pytest-instafail',
    'pre-commit'
]
all = [
    'mcp>=1.0.0',
    'pytest>=7.0.0', 
    'pytest-asyncio>=0.21.0',
    'flake8',
    'mypy',
    'pytest-cov',
    'coverage',
]

[tool.setuptools.dynamic]
version = {attr = "azurefunctions.agents.durable.__version__"}

[tool.setuptools.packages.find]
exclude = [
    'azurefunctions.agents','azurefunctions', 'tests', 'samples'
    ]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["azurefunctions"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
