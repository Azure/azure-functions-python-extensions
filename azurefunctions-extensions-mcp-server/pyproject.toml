[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azurefunctions-extensions-mcp-server"
dynamic = ["version"]
requires-python = ">=3.10"
authors = [{ name = "Azure Functions team at Microsoft Corp.", email = "azurefunctions@microsoft.com"}]
description = "MCP Python worker extension for Azure Functions."
readme = "README.md"
license = {text = "MIT License"}
classifiers= [
        'License :: OSI Approved :: MIT License',
        'Intended Audience :: Developers',
        'Programming Language :: Python :: 3',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Operating System :: MacOS :: MacOS X',
        'Environment :: Web Environment',
        'Development Status :: 5 - Production/Stable',
    ]
dependencies = [
        'azurefunctions-extensions-base',
        'azure-functions',
        'starlette~=0.46.1',
        'uvicorn~=0.32.0',
        'pydantic~=2.10.0',
        'mcp~=1.3.0'
    ]

[project.optional-dependencies]
dev = [
    'pytest',
    'pytest-cov',
    'coverage',
    'pytest-instafail',
    'pre-commit',
    'isort',
    'black'
    ]

[tool.setuptools.dynamic]
version = {attr = "azurefunctions.extensions.mcp_server.__version__"}

[tool.setuptools.packages.find]
exclude = [
    'azurefunctions.extensions.http','azurefunctions.extensions',
    'azurefunctions', 'tests', 'samples'
    ]

