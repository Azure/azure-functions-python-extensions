# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    # Files stored in repository root
    directory: "/azurefunctions-extensions-base"
    schedule:
      interval: "weekly"
    commit-message:
      # Prefix all commit messages with "build: "
      prefix: "build"

  - package-ecosystem: "pip"
    # Files stored in `app` directory
    directory: "/azurefunctions-extensions-http-fastapi"
    schedule:
      interval: "weekly"
    commit-message:
      # Prefix all commit messages with "build: "
      prefix: "build"

  - package-ecosystem: "pip"
    # Files stored in `app` directory
    directory: "/azurefunctions-extensions-bindings-blob"
    schedule:
      interval: "weekly"
    commit-message:
      # Prefix all commit messages with "build: "
      prefix: "build"
  - package-ecosystem: "pip"
    # Files stored in `app` directory
    directory: "/azurefunctions-extensions-bindings-cosmosdb"
    schedule:
      interval: "weekly"
    commit-message:
      # Prefix all commit messages with "build: "
      prefix: "build"
  - package-ecosystem: "pip"
    # Files stored in `app` directory
    directory: "/azurefunctions-extensions-bindings-eventhub"
    schedule:
      interval: "weekly"
    commit-message:
      # Prefix all commit messages with "build: "
      prefix: "build"
  - package-ecosystem: "pip"
    # Files stored in `app` directory
    directory: "/azurefunctions-extensions-bindings-servicebus"
    schedule:
      interval: "weekly"
    commit-message:
      # Prefix all commit messages with "build: "
      prefix: "build"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
