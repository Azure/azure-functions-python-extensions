name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'azurefunctions-mcp-stdio-adapter/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'azurefunctions-mcp-stdio-adapter/**'

env:
  PYTHON_VERSION: '3.11'
  WORKING_DIRECTORY: './azurefunctions-mcp-stdio-adapter'

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv sync --dev
    
    - name: Run Black (check formatting)
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv run black --check .
    
    - name: Run isort (check import sorting)
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv run isort --check-only .
    
    - name: Run Ruff (linting)
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv run ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv sync --dev
    
    - name: Run MyPy (type checking)
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv run mypy azurefunctions

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv sync --dev
    
    - name: Run unit tests
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv run pytest tests/unit/ -v --cov=azurefunctions --cov-report=xml --cov-report=html
    
    - name: Run integration tests
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv run pytest tests/integration/ -v
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ${{ env.WORKING_DIRECTORY }}/coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv sync --dev
    
    - name: Run Bandit (security linting)
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv run bandit -r azurefunctions -f json -o bandit-report.json || true
    
    - name: Upload Bandit results
      uses: actions/upload-artifact@v3
      with:
        name: bandit-results
        path: ${{ env.WORKING_DIRECTORY }}/bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, test]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv sync --dev
    
    - name: Build package
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        uv build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: ${{ env.WORKING_DIRECTORY }}/dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: dist
        path: ${{ env.WORKING_DIRECTORY }}/dist/
    
    - name: Publish to PyPI
      working-directory: ${{ env.WORKING_DIRECTORY }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        uv run twine upload dist/*
